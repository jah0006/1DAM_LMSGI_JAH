<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio1</title>
</head>
<body>
    
    <script>
        var num1 = prompt("Escribe un numero");
        var num2 = prompt("Escribe otro numero");
        var contador = 1;
        document.write("Numero 1: "+num1+"<br>");
        document.write("Numero 2: "+num2+"<br>");
        document.write("<hr>");

        document.writeln("<h3>Sentencia if-else</h3>"+"<br>");
        //Sentencia if-else
        if(parseInt(num1)>parseInt(num2)){
            document.write("El numero "+num1+" es mayor que el numero "+num2);
        }else if(parseInt(num1)==parseInt(num2)){
            document.write("Los dos numeros son iguales");
        }else{
            document.write("El numero "+num2+" es mayor que el numero "+num1);
        }

        document.write("<hr>");

        document.writeln("<h3>Sentencia for</h3>"+"<br>");
        //sentencia for
        for(var i = 1; i<10; i++){
            document.writeln("Esta es la "+i+" vez que se escribe esta linea con un for"+"<br>");
        }

        document.write("<hr>");
        document.write("<h3>Sentencia switch</h3><br>")
        switch (num1){
            case num2:
                document.write("Los numeros son iguales");
                break;
            default:
                document.write("Los numeros no son iguales");
        }
        document.write("<hr>");
        document.write("<h3>Sentencia while</h3><br>")
        while(contador<=10){
            document.write("Esto se repite hasta que "+contador+" sea 10 con un while<br>");
            contador++;
        }

    </script>
</body>
</html>
