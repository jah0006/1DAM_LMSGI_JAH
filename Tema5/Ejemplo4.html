<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form action="proceso.php" method="post">
        <p>Nombre: <input type="text" name="nombre" value="Nombre" readonly size="50px"></p>
        <p>Contraseña: <input type="password" name="contraseña"  maxlength="8" minlength="1" ></p>
        <p>Comentario: <textarea name="comentario" autofocus rows="4" cols="27"></textarea></p>
        <p><input type="submit"></p>
    </form>
<hr>

    <form action="proceso.php" method="post">
        <p><input type="checkbox" name="opcion1">Opción 1</p>
        <p><input type="checkbox" name="opcion2" checked>Opción 2</p>
        <p><input type="checkbox" name="opcion3">Opción 3</p>

        <p><select name="opciones" size="1px">
            <option value="opcion1">Opcion 1</option>
            <option value="opcion2">Opcion 2</option>
            <option value="opcion3">Opcion 3</option>
            <option value="opcion4">Opcion 4</option>
            <option value="opcion5">Opcion 5</option>
        </select></p>
        <p><input type="submit"></p>
    </form>
</body>
</html>
