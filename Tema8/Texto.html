<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EjemploTema8</title>
    <style>
        #p1 {
            text-align: right; 
            color: RGB(255,0,0);
            text-decoration: underline; /* Subrayar el texto */
            word-spacing: 20px;
        }

        #p2 {
            text-align: left;
            color: blue;
            letter-spacing: 10px; /* Espaciado entre las letras */
            line-height: 5rem; /* Espaciado superior e inferior del texto*/
        }

        #p3 {
            text-align: center;
            background-color: #00FF00;
            letter-spacing: 5px;
            text-transform: uppercase; /* Pone el texto en mayúsculas */
        }
        p::after{content: "- texto";}
    </style>
</head>
<body>
    <p id="p1"> Esto es un ejemplo </p>
    <p id="p2"> para ver como funcionan</p>
    <p id="p3"> las propiedades del texto</p>
</body>
</html>
