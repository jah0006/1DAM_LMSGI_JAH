<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propiedades CSS3</title>
    <style>
        p{
            border:solid 3px chocolate;
            width: 500px;
            padding: 10px;
            font-weight: bold;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 24px;
            background-color: cyan;
            border-top-left-radius: 40px;
            box-shadow: 10px 10px 10px grey;
            column-count: 2;
            transition: all 1s;
            margin:auto;
        }
        p:hover{
            transform: scale(2,2);
        }
    </style>
</head>
<body>
    <p>Texto de prueba</p>
</body>
</html>
